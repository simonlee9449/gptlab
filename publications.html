<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPT Lab - Publications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <div class="nav-logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M6 4c2 2.5 5 3 6 3s4-.5 6-3"/><path d="M6 20c2-2.5 5-3 6-3s4 .5 6 3"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="7" y1="10" x2="17" y2="10"/><line x1="7" y1="14" x2="17" y2="14"/><line x1="8" y1="17" x2="16" y2="17"/></svg></div>
        <span class="nav-logo-text">GPT Lab</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="people.html">People</a></li>
        <li><a href="publications.html">Publications</a></li>
        <li><a href="news.html">News</a></li>
      </ul>
    </div>
  </nav>

  <div class="page-hero">
    <div class="page-hero-left">
      <div class="label">Publications</div>
      <h1>Publications</h1>
      <p class="note">GPT Lab members shown in <strong>bold</strong> text</p>
    </div>
  </div>

  <div id="publications-container">
    <div class="loading">Loading publications...</div>
  </div>

  <footer>
    <div class="footer-inner">
      <div class="footer-info">
        <p>Sungkyunkwan University, SAIHST &amp; Samsung Medical Center<br>81, Irwon-ro, Gangnam-gu, Seoul</p>
      </div>
      <div class="footer-logos">
        <img src="images/skku-logo.jpeg" alt="SKKU" class="footer-logo">
        <img src="images/saihst-logo.jpeg" alt="SAIHST" class="footer-logo">
        <img src="images/smc-logo.png" alt="SMC" class="footer-logo">
      </div>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script>
    var publications = [];

    async function loadPublications() {
      try {
        var response = await fetch('data/publications.json');
        publications = await response.json();
      } catch (error) {
        console.error('Error loading publications:', error);
        publications = [];
      }
      renderPublications();
    }

    function renderPublications() {
      var container = document.getElementById('publications-container');

      if (!publications || publications.length === 0) {
        container.innerHTML = '<div class="loading">No publications found.</div>';
        return;
      }

      var byYear = {};
      for (var i = 0; i < publications.length; i++) {
        var p = publications[i];
        if (!byYear[p.year]) byYear[p.year] = [];
        byYear[p.year].push(p);
      }

      var years = Object.keys(byYear).sort(function(a, b) { return b - a; });

      var html = '';
      for (var j = 0; j < years.length; j++) {
        var year = years[j];
        html += '<section class="pub-section"><h2 class="year-heading">' + year + '</h2><ul class="pub-list">';
        var pubs = byYear[year];
        for (var k = 0; k < pubs.length; k++) {
          var pub = pubs[k];
          html += '<li class="pub-item">' +
            pub.authors + '. ' + pub.title + '. <em>' + pub.journal + '</em>. ' + (pub.details || '') +
            (pub.link ? ' <a href="' + pub.link + '" class="pub-link" target="_blank">Link</a>' : '') +
          '</li>';
        }
        html += '</ul></section>';
      }

      container.innerHTML = html;

      // Reveal 애니메이션 재적용
      document.querySelectorAll('.pub-section').forEach(function(el) {
        el.classList.add('reveal', 'visible');
      });
    }

    loadPublications();
  </script>
</body>
</html>
